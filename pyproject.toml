[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-review-agent"
version = "1.0.0"
description = "Autonomous AI-powered code review system with confidence-rated comments"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "GitPython==3.1.43",
    "openai==1.12.0",
    "streamlit==1.31.0",
    "python-dotenv==1.0.1",
    "PyGithub==2.1.1",
    "pandas==2.2.1",
    "pydantic==2.6.3",
    "tenacity==8.2.3",
    "tiktoken==0.5.2",
]

[tool.setuptools]
packages = ["src"]
